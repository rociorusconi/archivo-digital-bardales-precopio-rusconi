spring.datasource.url=jdbc:h2:mem:tp
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

springdoc.paths-to-match=/api/**

spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

spring.config.import=optional:file:.env[.properties]
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
# Locally the bot asks Telegram for new messages (long polling): no public URL needed.
telegram.bot.mode=polling

# Base URL of the REST API used by the bot (the bot is one more client of the API).
archive.api.base-url=http://localhost:${server.port:8080}
