spring.datasource.url=jdbc:h2:mem:tp
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=false

springdoc.paths-to-match=/api/**
server.forward-headers-strategy=framework

spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never

server.port=${PORT:8080}

telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
# polling (default) or webhook. Webhook needs the public HTTPS URL of the application
# (e.g. https://archivo-digital.onrender.com); Telegram calls <url>/telegram/webhook.
telegram.bot.mode=${TELEGRAM_BOT_MODE:polling}
telegram.bot.webhook-url=${TELEGRAM_WEBHOOK_URL:}
# Optional: when empty a random secret is generated on each start.
telegram.bot.webhook-secret=${TELEGRAM_WEBHOOK_SECRET:}

# Base URL of the REST API used by the bot (the bot is one more client of the API).
archive.api.base-url=http://localhost:${server.port:8080}
